<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms And Form Validation</title>
    <style>
        small {
            color: red;
            font-size: 12px;

        }

        #hide {
            display: none;
        }
    </style>
</head>

<body>

    <form>
        <input pattern="[a-z]{3,8}"  minlength="3" maxlength="10"  id="name" type="text" placeholder="Name">
        <div id="hide">
            <br>
            <small>your name should be greater than 2 characters</small>
        </div>
        <br><br>
        <input type="email" placeholder="Email">
        <br><br>
        <input type="password" placeholder="password">
        <br><br>
        <select>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>
        <br><br>
        <textarea name="" id="" placeholder="Tell us about you..."></textarea>
        <br><br>
        <input type="Submit">
    </form>











    <script src="FormsAndFormValidation.js"></script>
</body>

</html>
