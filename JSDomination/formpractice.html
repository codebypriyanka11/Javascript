// *email/passward validation  
// *interactive feedback form with error highlight -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email & Password Validator</title>
    <link rel="stylesheet" href="formpractice.css">
</head>
<body>

    <div class="container">
        <form autocomplete="off" class="form">
            <h2>Login Form</h2>

            <div class="input-group">
                <label>Email</label>
                <input
                    type="text"
                    id="email"
                    autocomplete="off"
                    placeholder="Enter your email"
                >
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >
            </div>

            <button type="submit" id="submitBtn">
                Login
            </button>

            <p id="message"></p>
        </form>
    </div>

    <script src="formpractice.js"></script>

</body>
</html>
