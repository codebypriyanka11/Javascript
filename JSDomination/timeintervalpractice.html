<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Simulation</title>
    <link rel="stylesheet" href="timeintervalpractice.css">
</head>
<body>

<div class="card">

    <div class="top">
        <div class="icon">📄</div>

        <div class="details">
            <h2>JavaScript_Course.pdf</h2>
            <p>Size : 25 MB</p>
        </div>
    </div>

    <div class="progress-box">
        <div class="progress"></div>
    </div>

    <div class="bottom">

        <span class="status">Ready to Download</span>

        <span class="percent">0%</span>

    </div>

    <button id="downloadBtn">Download</button>

</div>

<script src="timeintervalpractice.js"></script>

</body>
</html>
